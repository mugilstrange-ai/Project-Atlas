<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mugilan · Project Atlas Team</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      background: #eef2f7;
      color: #1f2a37;
    }
    .profile-card {
      width: min(380px, 92vw);
      padding: 32px 28px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(31, 58, 95, 0.15);
      text-align: center;
    }
    .avatar {
      width: 88px;
      height: 88px;
      margin: 0 auto 16px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #1f3a5f;
      color: #ffffff;
      font-size: 2.2rem;
      font-weight: 700;
    }
    h1 { margin: 0; font-size: 1.6rem; }
    .role { margin: 4px 0 16px; color: #e8762b; font-weight: 600; }
    .intro { margin: 0 0 20px; line-height: 1.55; color: #4a5668; }
    h2 { margin: 0 0 10px; font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase; color: #1f3a5f; }
    .skills { list-style: none; margin: 0 0 24px; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    .skills li { padding: 6px 12px; border-radius: 999px; background: #eef2f7; font-size: 0.9rem; }
    .profile-link {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 8px;
      background: #1f3a5f;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
    }
    .profile-link:hover, .profile-link:focus-visible { background: #e8762b; }
  </style>
</head>
<body>
  <main>
    <article class="profile-card">
      <header>
        <div class="avatar" aria-hidden="true">M</div>
        <h1>Mugilan</h1>
        <p class="role">Student Developer · Project Atlas</p>
      </header>

      <p class="intro">
        I am a student developer learning to build clean, accessible web pages
        and small Python tools, one well-reviewed pull request at a time.
      </p>

      <section aria-labelledby="skills-heading">
        <h2 id="skills-heading">Skills</h2>
        <ul class="skills">
          <li>Python</li>
          <li>HTML &amp; CSS</li>
          <li>Git &amp; GitHub</li>
        </ul>
      </section>

      <footer>
        <a class="profile-link" href="https://github.com/mugilstrange-ai" target="_blank" rel="noopener noreferrer"
           aria-label="Visit Mugilan's GitHub profile (opens in a new tab)">GitHub</a>
      </footer>
    </article>
  </main>
</body>
</html>
